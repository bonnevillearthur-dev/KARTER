<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mon Coach — Musculation</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3A36E0">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBEEF4; --surface:#FFFFFF; --ink:#111524; --muted:#646C80;
    --line:#E0E5EE; --brand:#3A36E0; --brand-dark:#2A27B8;
    --pop:#FF5A34; --pop-soft:#FFE7DF; --ok:#12B886; --ok-soft:#DCF6EC;
    --idle:#CBD2E0; --shadow:0 10px 30px -12px rgba(20,25,45,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);
    background:var(--bg);line-height:1.5;
    max-width:560px;margin:0 auto;min-height:100vh;
    padding:0 16px 96px;
  }
  .anton{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;text-transform:uppercase}
  h1,h2,h3{margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ---------- HEADER ---------- */
  header{padding:22px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:42px;height:42px;border-radius:13px;background:var(--brand);
    display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
  .logo svg{width:24px;height:24px}
  .brand h1{font-size:15px;letter-spacing:1.2px;line-height:1.05}
  .brand span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.4px}

  /* ---------- WEEK STRIP ---------- */
  .week{background:var(--ink);color:#fff;border-radius:20px;padding:16px 18px;margin-top:6px;
    display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
  .week .lbl{font-size:11px;letter-spacing:1.4px;color:#9aa2bd;font-weight:700;text-transform:uppercase}
  .week .big{font-size:30px;line-height:1}
  .week .big small{font-size:15px;color:#9aa2bd}
  .rings{display:flex;gap:8px}
  .ring{width:44px;height:44px;border-radius:14px;border:2px solid #333a55;display:grid;place-items:center;
    font-family:'Anton';font-size:19px;color:#5b6486;background:#1b2135}
  .ring.done{background:var(--ok);border-color:var(--ok);color:#04321f}
  .reset{margin-top:10px;text-align:center}
  .reset button{font-size:12px;color:var(--muted);font-weight:600;padding:6px}
  .reset button:active{color:var(--pop)}

  /* ---------- SESSION TILES ---------- */
  .section-t{font-size:12px;letter-spacing:1.6px;color:var(--muted);font-weight:700;
    text-transform:uppercase;margin:24px 4px 12px}
  .tiles{display:grid;gap:14px}
  .tile{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow);
    display:flex;gap:16px;align-items:center;text-align:left;width:100%;transition:transform .12s}
  .tile:active{transform:scale(.98)}
  .tile .badge{width:60px;height:60px;border-radius:18px;flex:none;display:grid;place-items:center;
    font-family:'Anton';font-size:30px;color:#fff}
  .tile.a .badge{background:linear-gradient(150deg,#3A36E0,#6a45f0)}
  .tile.b .badge{background:linear-gradient(150deg,#FF5A34,#ff8a4b)}
  .tile .info{flex:1;min-width:0}
  .tile .info .top{display:flex;align-items:center;gap:8px}
  .tile h3{font-size:20px}
  .tile .tag{font-size:10px;font-weight:800;letter-spacing:.5px;padding:3px 8px;border-radius:20px;text-transform:uppercase}
  .tile .tag.ok{background:var(--ok-soft);color:#0a6b47}
  .tile .tag.todo{background:#EEF0F6;color:var(--muted)}
  .tile .muscles{font-size:13px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .cnt{font-size:12px;color:var(--brand);font-weight:700;margin-top:6px}
  .chev{color:var(--idle);flex:none}

  .note{background:var(--pop-soft);border-radius:16px;padding:14px 16px;margin-top:18px;
    font-size:13px;color:#8a3417;display:flex;gap:10px}
  .note svg{flex:none;margin-top:1px}

  /* ---------- SESSION DETAIL ---------- */
  .back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;
    color:var(--muted);padding:20px 4px 8px}
  .back:active{color:var(--ink)}
  .poster{border-radius:24px;padding:24px 22px;color:#fff;box-shadow:var(--shadow);margin-bottom:6px}
  .poster.a{background:linear-gradient(150deg,#3A36E0,#6a45f0)}
  .poster.b{background:linear-gradient(150deg,#FF5A34,#ff8a4b)}
  .poster .eyebrow{font-size:11px;letter-spacing:2px;font-weight:700;opacity:.85;text-transform:uppercase}
  .poster h2{font-size:40px;line-height:.95;margin:4px 0 8px}
  .poster p{font-size:13px;opacity:.92;margin:0}

  .exlist{display:grid;gap:12px;margin-top:16px}
  .exrow{background:var(--surface);border-radius:18px;padding:14px;display:flex;align-items:center;gap:13px;
    box-shadow:var(--shadow);width:100%;text-align:left;transition:transform .1s}
  .exrow:active{transform:scale(.985)}
  .exnum{width:34px;height:34px;border-radius:11px;background:var(--bg);flex:none;display:grid;place-items:center;
    font-family:'Anton';font-size:16px;color:var(--brand)}
  .exrow.done .exnum{background:var(--ok-soft);color:var(--ok)}
  .exrow .exmeta{flex:1;min-width:0}
  .exrow h4{font-size:15px;font-weight:700;margin:0 0 2px}
  .exrow .sub{font-size:12px;color:var(--muted)}
  .exrow .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
  .exrow.done .check{background:var(--ok);border-color:var(--ok)}
  .exrow.done .check svg{opacity:1}
  .exrow .check svg{opacity:0}

  .finish{width:100%;margin-top:20px;background:var(--ink);color:#fff;border-radius:16px;
    padding:16px;font-weight:800;font-size:15px;letter-spacing:.3px;box-shadow:var(--shadow)}
  .finish.on{background:var(--ok)}
  .finish:active{transform:scale(.99)}

  /* ---------- EXERCISE DETAIL ---------- */
  .card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-top:6px}
  .illus{background:radial-gradient(120% 90% at 50% 30%,#FFFFFF 0%,#E9EDF5 100%);padding:6px 6px 0}
  .illus svg{width:100%;height:auto;display:block}
  .cbody{padding:20px}
  .cbody h2{font-size:23px;font-weight:800;line-height:1.1}
  .aka{font-size:13px;color:var(--muted);margin:2px 0 14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .chip{font-size:11px;font-weight:700;background:var(--pop-soft);color:#a53c19;
    padding:5px 10px;border-radius:20px;text-transform:capitalize}

  .stats{display:flex;gap:10px;margin-bottom:20px}
  .stat{flex:1;background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center}
  .stat .n{font-family:'Anton';font-size:24px;color:var(--brand);line-height:1}
  .stat .k{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-top:4px}

  .subh{font-size:12px;letter-spacing:1.4px;font-weight:800;color:var(--ink);text-transform:uppercase;
    margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .subh::before{content:"";width:20px;height:3px;border-radius:3px;background:var(--pop)}

  .steps{display:grid;gap:12px;margin-bottom:24px}
  .step{display:flex;gap:12px;align-items:flex-start}
  .step .sn{width:26px;height:26px;border-radius:9px;background:var(--brand);color:#fff;flex:none;
    display:grid;place-items:center;font-family:'Anton';font-size:14px}
  .step p{margin:0;font-size:14px}

  .bodymap{display:flex;justify-content:center;gap:14px;background:var(--bg);border-radius:18px;padding:16px 8px;margin-bottom:22px}
  .figwrap{text-align:center}
  .figwrap .cap{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-top:4px}
  .blk{fill:var(--idle);transition:fill .3s}
  .blk.on{fill:var(--pop)}
  .fig-outline{fill:none;stroke:#B7BFCF;stroke-width:2}
  .fig-head{fill:#DDE2EC}

  .tip{background:#FFF6E9;border-radius:16px;padding:14px 16px;display:flex;gap:11px;margin-bottom:8px}
  .tip svg{flex:none;margin-top:1px}
  .tip .tt{font-size:11px;font-weight:800;letter-spacing:.5px;color:#B26a00;text-transform:uppercase}
  .tip p{margin:2px 0 0;font-size:13px;color:#7a5410}

  .markbtn{width:100%;margin-top:18px;border-radius:16px;padding:16px;font-weight:800;font-size:15px;
    border:2px solid var(--brand);color:var(--brand);background:#fff;box-shadow:var(--shadow)}
  .markbtn.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .markbtn:active{transform:scale(.99)}

  .resetbtn{width:100%;margin-top:10px;border-radius:14px;padding:13px;font-weight:700;font-size:14px;
    color:var(--muted);background:transparent;border:1.5px solid var(--line)}
  .resetbtn:active{transform:scale(.99);color:var(--pop);border-color:var(--pop)}

  /* --- suivi de charge --- */
  .logform{display:flex;gap:8px;margin-bottom:14px}
  .logfield{flex:1}
  .logfield label{display:block;font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--muted);
    text-transform:uppercase;margin:0 0 4px 2px}
  .logfield input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:16px;
    font-weight:700;font-family:'Inter';color:var(--ink);background:var(--surface);text-align:center}
  .logfield input:focus{outline:none;border-color:var(--brand)}
  .logadd{flex:none;align-self:flex-end;background:var(--brand);color:#fff;border-radius:12px;padding:12px 16px;
    font-weight:800;font-size:14px;box-shadow:var(--shadow)}
  .logadd:active{transform:scale(.97)}
  .logempty{font-size:13px;color:var(--muted);background:var(--bg);border-radius:12px;padding:14px;text-align:center}
  .loglist{display:grid;gap:7px;margin-top:4px}
  .logrow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:11px;padding:9px 12px}
  .logrow .ld{font-size:12px;color:var(--muted);font-weight:600;width:52px;flex:none}
  .logrow .lw{font-family:'Anton';font-size:17px;color:var(--brand)}
  .logrow .lr{font-size:12px;color:var(--muted)}
  .logrow .lx{margin-left:auto;color:var(--idle);font-size:18px;font-weight:700;padding:0 4px}
  .logrow .lx:active{color:var(--pop)}
  .logrow .up{color:var(--ok);font-size:12px;font-weight:800}
  .logchart{background:var(--bg);border-radius:14px;padding:12px 8px 6px;margin:4px 0 14px}
  .logchart svg{width:100%;height:auto;display:block}
  .logpr{display:flex;gap:10px;margin-bottom:12px}
  .logpr .b{flex:1;background:var(--brand);color:#fff;border-radius:12px;padding:10px;text-align:center}
  .logpr .b.alt{background:var(--ink)}
  .logpr .n{font-family:'Anton';font-size:20px;line-height:1}
  .logpr .k{font-size:9px;font-weight:700;letter-spacing:.5px;opacity:.85;text-transform:uppercase;margin-top:3px}

  /* --- minuteur de repos --- */
  .timer{background:var(--ink);border-radius:18px;padding:16px 18px;margin-bottom:22px;box-shadow:var(--shadow)}
  .timer.ring{background:var(--ok)}
  .timer .trow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tlbl{font-size:10px;font-weight:800;letter-spacing:1px;color:#9aa2bd;text-transform:uppercase}
  .timer.ring .tlbl{color:#0a3a26}
  .tbig{font-family:'Anton';font-size:38px;color:#fff;line-height:1;margin-top:2px;font-variant-numeric:tabular-nums}
  .timer.ring .tbig{color:#04321f}
  .tctrl{display:flex;align-items:center;gap:8px}
  .tmain{background:var(--brand);color:#fff;font-weight:800;font-size:14px;border-radius:12px;padding:11px 16px}
  .tmain:active{transform:scale(.96)}
  .tsec{background:#2a3350;color:#cfd5e8;font-weight:800;font-size:13px;border-radius:12px;padding:11px 12px}
  .timer.ring .tsec{background:#0a9e6a;color:#eafff5}
  .tsec:active{transform:scale(.96)}
  .tbar{height:6px;background:#2a3350;border-radius:6px;margin-top:14px;overflow:hidden}
  .timer.ring .tbar{background:#0a9e6a}
  .tfill{height:100%;width:100%;background:var(--pop);border-radius:6px;transition:width .3s linear}
  .timer.ring .tfill{background:#fff}

  /* --- carte progression (accueil) --- */
  .progcard{width:100%;text-align:left;margin-top:14px;background:var(--surface);border-radius:22px;
    padding:18px 20px;box-shadow:var(--shadow);display:flex;align-items:center;gap:15px;transition:transform .12s}
  .progcard:active{transform:scale(.98)}
  .pcicon{width:48px;height:48px;border-radius:15px;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,#3A36E0,#6a45f0)}
  .pcinfo{flex:1;min-width:0}
  .pcinfo h3{font-size:17px;font-weight:800}
  .pcinfo span{font-size:12px;color:var(--muted)}

  /* --- page progression --- */
  .pglist{display:grid;gap:14px;margin-top:16px}
  .pgex{width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:16px 16px 8px;box-shadow:var(--shadow)}
  .pgex:active{transform:scale(.99)}
  .pgtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
  .pgname{font-size:16px;font-weight:800}
  .pgmeta{font-size:12px;color:var(--muted);margin-top:2px}
  .pdiff{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;background:var(--bg);padding:5px 9px;border-radius:20px}
  .pdiff.up{color:#0a6b47;background:var(--ok-soft)}
  .pdiff.dn{color:#a53c19;background:var(--pop-soft)}

  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .arrow-anim{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.arrow-anim{animation:none;opacity:1}.fade{animation:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DONNÉES DU PROGRAMME  (débutant · full-body A/B · salle)
   ========================================================= */
const PROGRAM = {
  A: {
    letter:"A", name:"Séance A", theme:"a",
    subtitle:"Pectoraux · Dos · Épaules · Bras · Abdos",
    exercises:[
      { id:"a1", name:"Développé couché machine", aka:"Chest press",
        muscles:["pectoraux","epaules","triceps"], sets:"4", reps:"10", rest:"90 s", pic:"chestpress",
        steps:[
          "Règle le siège pour que les poignées soient au niveau de ta poitrine.",
          "Pousse les poignées vers l'avant jusqu'à tendre les bras (sans les bloquer).",
          "Reviens lentement en contrôlant, coudes légèrement rentrés.",
          "Garde les omoplates serrées et le dos plaqué."],
        tip:"Ne descends pas trop vite : c'est la phase de retour qui muscle le plus." },
      { id:"a2", name:"Tirage vertical", aka:"Lat pulldown (poulie haute)",
        muscles:["grand-dorsal","biceps","dos"], sets:"4", reps:"12", rest:"75 s", pic:"latpull",
        steps:[
          "Assis, cuisses bien bloquées sous les cales, attrape la barre large.",
          "Tire la barre vers le haut de la poitrine en descendant les coudes.",
          "Serre les omoplates en bas du mouvement.",
          "Remonte lentement bras tendus, sans lâcher d'un coup."],
        tip:"Tire avec le dos, pas avec les bras : imagine plier les coudes vers les poches." },
      { id:"a7", name:"Rowing assis poulie", aka:"Seated cable row",
        muscles:["dos","grand-dorsal","biceps"], sets:"4", reps:"12", rest:"75 s", pic:"row",
        steps:[
          "Assis, pieds calés, genoux légèrement fléchis, dos droit.",
          "Tire la poignée vers le nombril en ramenant les coudes en arrière.",
          "Serre les omoplates l'une vers l'autre.",
          "Reviens lentement bras tendus sans arrondir le dos."],
        tip:"Reste droit : évite de te balancer d'avant en arrière pour tricher." },
      { id:"a3", name:"Développé épaules machine", aka:"Shoulder press",
        muscles:["epaules","triceps"], sets:"4", reps:"10", rest:"75 s", pic:"shoulderpress",
        steps:[
          "Assis, dos calé, poignées au niveau des épaules.",
          "Pousse les poignées vers le plafond jusqu'à presque tendre les bras.",
          "Redescends lentement jusqu'aux épaules.",
          "Ne creuse pas le bas du dos : garde le ventre gainé."],
        tip:"Si tu sens trop le bas du dos, baisse la charge et gaine les abdos." },
      { id:"a4", name:"Curl biceps haltères", aka:"Dumbbell curl",
        muscles:["biceps"], sets:"4", reps:"12", rest:"60 s", pic:"curl",
        steps:[
          "Debout, un haltère dans chaque main, bras le long du corps.",
          "Monte les haltères vers les épaules en pliant les coudes.",
          "Serre le biceps en haut une seconde.",
          "Redescends lentement sans balancer le buste."],
        tip:"Colle les coudes au corps : ne les laisse pas partir vers l'avant." },
      { id:"a5", name:"Extension triceps poulie", aka:"Triceps pushdown",
        muscles:["triceps"], sets:"4", reps:"12", rest:"60 s", pic:"pushdown",
        steps:[
          "Debout face à la poulie haute, attrape la barre ou la corde.",
          "Coudes collés au corps, pousse vers le bas jusqu'à tendre les bras.",
          "Serre le triceps en bas une seconde.",
          "Remonte lentement sans écarter les coudes."],
        tip:"Seuls les avant-bras bougent : le haut des bras reste immobile." },
      { id:"a6", name:"Gainage (planche)", aka:"Plank",
        muscles:["abdos"], sets:"4", reps:"30 s", rest:"45 s", pic:"plank",
        steps:[
          "En appui sur les avant-bras et la pointe des pieds.",
          "Aligne tête, dos et talons : le corps forme une planche.",
          "Contracte les abdos et les fessiers, ne creuse pas le dos.",
          "Tiens la position en respirant calmement."],
        tip:"Ne lève pas les fesses vers le plafond : garde le corps bien droit." },
    ]
  },
  B: {
    letter:"B", name:"Séance B", theme:"b",
    subtitle:"Pectoraux · Dos · Épaules · Bras · Abdos",
    exercises:[
      { id:"b1", name:"Développé incliné machine", aka:"Incline chest press",
        muscles:["pectoraux","epaules"], sets:"4", reps:"10", rest:"90 s", pic:"incline",
        steps:[
          "Assis sur le siège incliné, poignées en haut de la poitrine.",
          "Pousse vers le haut et l'avant jusqu'à presque tendre les bras.",
          "Contrôle la descente jusqu'au niveau de la poitrine.",
          "Garde les omoplates serrées, sans hausser les épaules."],
        tip:"Ne monte pas les épaules vers les oreilles : garde-les basses." },
      { id:"b2", name:"Rowing assis poulie", aka:"Seated cable row",
        muscles:["dos","grand-dorsal","biceps"], sets:"4", reps:"12", rest:"75 s", pic:"row",
        steps:[
          "Assis, pieds calés, genoux légèrement fléchis, dos droit.",
          "Tire la poignée vers le nombril en ramenant les coudes en arrière.",
          "Serre les omoplates l'une vers l'autre.",
          "Reviens lentement bras tendus sans arrondir le dos."],
        tip:"Reste droit : évite de te balancer d'avant en arrière pour tricher." },
      { id:"b7", name:"Tirage vertical", aka:"Lat pulldown (poulie haute)",
        muscles:["grand-dorsal","biceps","dos"], sets:"4", reps:"12", rest:"75 s", pic:"latpull",
        steps:[
          "Assis, cuisses bien bloquées sous les cales, attrape la barre large.",
          "Tire la barre vers le haut de la poitrine en descendant les coudes.",
          "Serre les omoplates en bas du mouvement.",
          "Remonte lentement bras tendus, sans lâcher d'un coup."],
        tip:"Tire avec le dos, pas avec les bras : imagine plier les coudes vers les poches." },
      { id:"b3", name:"Élévations latérales", aka:"Lateral raises",
        muscles:["epaules"], sets:"4", reps:"14", rest:"60 s", pic:"lateral",
        steps:[
          "Debout, un haltère léger dans chaque main le long du corps.",
          "Lève les bras sur les côtés jusqu'à l'horizontale (hauteur épaules).",
          "Coudes très légèrement pliés, comme si tu versais de l'eau.",
          "Redescends lentement, sans à-coups."],
        tip:"Charge léger ! Ce muscle répond mieux au contrôle qu'au poids lourd." },
      { id:"b4", name:"Curl marteau haltères", aka:"Hammer curl",
        muscles:["biceps"], sets:"4", reps:"12", rest:"60 s", pic:"curl",
        steps:[
          "Debout, un haltère dans chaque main, paumes tournées vers le corps.",
          "Monte les haltères vers les épaules sans tourner les poignets.",
          "Serre en haut une seconde.",

/* ---------- PAGE PROGRESSION ---------- */
function renderProgress(){
  const all=[...PROGRAM.A.exercises.map(e=>({e,s:"A"})),...PROGRAM.B.exercises.map(e=>({e,s:"B"}))];
  const seen=new Set();
  const withLogs=all.filter(({e})=>{
    const has=(STATE.logs[e.id]||[]).length>0 && !seen.has(e.name);
    if(has) seen.add(e.name);
    return has;
  });
  let body;
  if(!withLogs.length){
    body=`<div class="logempty" style="margin-top:16px">Aucune donnée enregistrée pour l'instant.<br>Ouvre un exercice et note la charge utilisée : tes courbes apparaîtront ici.</div>`;
  } else {
    body=withLogs.map(({e,s})=>{
      const logs=STATE.logs[e.id];
      const weights=logs.map(l=>l.w);
      const last=weights[weights.length-1], pr=Math.max(...weights), first=weights[0];
      const diff=+(last-first).toFixed(1);
      const trend = diff>0?`<span class="pdiff up">▲ +${diff} kg</span>`:(diff<0?`<span class="pdiff dn">▼ ${diff} kg</span>`:`<span class="pdiff">→ stable</span>`);
      const chart = weights.length>=2 ? logChart(weights) : `<div class="logempty">Une seule mesure — enregistre-en d'autres pour voir la courbe.</div>`;
      return `<button class="pgex" onclick="go({name:'exercise',s:'${s}',ex:'${e.id}'})">
          <div class="pgtop">
            <div><div class="pgname">${e.name}</div><div class="pgmeta">${logs.length} mesure${logs.length>1?'s':''} · PR ${pr} kg</div></div>
            ${trend}
          </div>
          ${chart}
        </button>`;
    }).join("");
  }
  app.innerHTML=`
    <button class="back" onclick="go({name:'home'})">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Accueil

      <h2 class="anton">Ma progression</h2>
      <p>Tes charges enregistrées, exercice par exercice.</p>
    </div>
    <div class="pglist fade">${body}</div>`;
}

/* --- minuteur de repos --- */
let TIMER={total:60, remaining:60, id:null, running:false};
function parseRest(str){ const m=String(str).match(/\d+/); return m?parseInt(m[0],10):60; }
function fmt(s){ const m=Math.floor(s/60), x=s%60; return (m<10?"0":"")+m+":"+(x<10?"0":"")+x; }
function updateTimerDisplay(){
  const d=document.getElementById("tDisp"); if(d) d.textContent=fmt(TIMER.remaining);
  const f=document.getElementById("tFill"); if(f) f.style.width=(TIMER.total? (TIMER.remaining/TIMER.total*100):0)+"%";
  const b=document.getElementById("tToggle"); if(b) b.textContent=TIMER.running?"Pause":(TIMER.remaining<TIMER.total&&TIMER.remaining>0?"Reprendre":"Démarrer");
  const c=document.getElementById("timerCard"); if(c) c.classList.toggle("ring", TIMER.remaining===0);
}
function initTimer(sec){ stopTimer(); TIMER.total=sec; TIMER.remaining=sec; TIMER.running=false; updateTimerDisplay(); }
function stopTimer(){ if(TIMER.id){ clearInterval(TIMER.id); TIMER.id=null; } TIMER.running=false; }
function timerToggle(){ TIMER.running ? timerPause() : timerStart(); }
function timerStart(){
  if(TIMER.running) return;
  if(TIMER.remaining<=0) TIMER.remaining=TIMER.total;
  TIMER.running=true;
  TIMER.id=setInterval(()=>{
    TIMER.remaining--;
    if(TIMER.remaining<=0){ TIMER.remaining=0; stopTimer(); timerDone(); }
    updateTimerDisplay();
  },1000);
  updateTimerDisplay();
}
function timerPause(){ stopTimer(); updateTimerDisplay(); }
function timerReset(){ stopTimer(); TIMER.remaining=TIMER.total; updateTimerDisplay(); }
function timerAdd(s){ TIMER.remaining+=s; if(TIMER.remaining>TIMER.total) TIMER.total=TIMER.remaining; updateTimerDisplay(); }
function timerDone(){
  try{ if(navigator.vibrate) navigator.vibrate([200,90,200]); }catch(e){}
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC();
    [0,0.18,0.36].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+t+0.14);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.15);
    });
  }catch(e){}
}

/* --- suivi de charge --- */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function frDate(iso){ const p=iso.split("-"); return p[2]+"/"+p[1]; }

async function logWeight(exId){
  const wi=document.getElementById("w-"+exId), ri=document.getElementById("r-"+exId);
  const w=parseFloat((wi&&wi.value||"").replace(",","."));
  const r=parseInt(ri&&ri.value||"",10);
  if(isNaN(w)){ if(wi){ wi.style.borderColor="var(--pop)"; wi.focus(); } return; }
  if(!STATE.logs[exId]) STATE.logs[exId]=[];
  STATE.logs[exId].push({ d:todayISO(), w:w, r:isNaN(r)?null:r });
  await saveState(); render();
}
async function deleteLog(exId, idx){
  if(STATE.logs[exId]){ STATE.logs[exId].splice(idx,1); if(!STATE.logs[exId].length) delete STATE.logs[exId]; }
  await saveState(); render();
}

function renderLogHistory(exId){
  const logs = STATE.logs[exId] || [];
  if(!logs.length){
    return `<div class="logempty">Pas encore de données. Enregistre la charge utilisée aujourd'hui pour suivre ta progression au fil des séances.</div>`;
  }
  const weights = logs.map(l=>l.w);
  const pr = Math.max(...weights);
  const last = weights[weights.length-1];
  const prBlock = `<div class="logpr">
      <div class="b"><div class="n">${last} kg</div><div class="k">Dernière charge</div></div>
      <div class="b alt"><div class="n">${pr} kg</div><div class="k">Record (PR)</div></div>
    </div>`;
  const chart = logs.length>=2 ? logChart(weights) : "";
  const rows = logs.map((l,i)=>({l,i})).reverse().map(({l,i})=>{
    const prev = i>0 ? logs[i-1].w : null;
    const up = prev!=null && l.w>prev ? `<span class="up">▲</span>` : "";
    const reps = l.r!=null ? `<span class="lr">× ${l.r} reps</span>` : "";
    return `<div class="logrow">
        <span class="ld">${frDate(l.d)}</span>
        <span class="lw">${l.w} kg</span> ${reps} ${up}
        <span class="lx" onclick="deleteLog('${exId}',${i})">×</span>
      </div>`;
  }).join("");
  return prBlock + chart + `<div class="loglist">${rows}</div>`;
}

function logChart(data){
  const w=300,h=96,pl=8,pr=8,pt=14,pb=20,n=data.length;
  let mn=Math.min(...data), mx=Math.max(...data);
  if(mn===mx){ mn-=1; mx+=1; }
  const X=i=> pl + i*(w-pl-pr)/(n-1);
  const Y=v=> pt + (mx-v)/(mx-mn)*(h-pt-pb);
  const pts=data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`M${X(0).toFixed(1)},${(h-pb).toFixed(1)} L`+data.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" L")+` L${X(n-1).toFixed(1)},${(h-pb).toFixed(1)} Z`;
  const dots=data.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="#3A36E0"/>`).join("");
  const lastLbl=`<text x="${X(n-1).toFixed(1)}" y="${(Y(data[n-1])-8).toFixed(1)}" text-anchor="end" font-family="Anton" font-size="13" fill="#3A36E0">${data[n-1]}</text>`;
  return `<div class="logchart"><svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A36E0" stop-opacity="0.18"/><stop offset="1" stop-color="#3A36E0" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#lg)"/>
    <polyline points="${pts}" fill="none" stroke="#3A36E0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${lastLbl}
  </svg></div>`;
}

/* =========================================================
   VIGNETTES D'EXERCICES  (style « tableau du coach »)
   ========================================================= */
const M_LIGHT="#9AA3B7", M_DARK="#5C6478", SEAT="#3A36E0", STACK="#C4CBD9",
      STK="#8B93A7", BODY="#212840", SKIN="#EBB58E", CABLE="#3A4152", POP="#FF5A34", FLOOR="#D3D9E4";
const DEFS=`<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7z" fill="${POP}"/></marker></defs>`;
function scene(inner){ return `<svg viewBox="0 0 240 165" xmlns="http://www.w3.org/2000/svg">${DEFS}<rect x="0" y="0" width="240" height="165" fill="none"/>${inner}</svg>`; }
function seg(d,c,w){ return `<path d="${d}" fill="none" stroke="${c||BODY}" stroke-width="${w||7}" stroke-linecap="round" stroke-linejoin="round"/>`; }
function torso(d){ return seg(d,BODY,13); }
function hd(cx,cy,r){ return `<circle cx="${cx}" cy="${cy}" r="${r||9}" fill="${SKIN}" stroke="${BODY}" stroke-width="2"/>`; }
function box(x,y,w,h,c,rx){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx==null?3:rx}" fill="${c}"/>`; }
function stack(x,y,w,h){ let l=''; for(let i=1;i*9<h;i++) l+=`<line x1="${x}" y1="${y+i*9}" x2="${x+w}" y2="${y+i*9}" stroke="${STK}" stroke-width="1.5"/>`; return box(x,y,w,h,STACK,2)+l; }
function cable(d){ return `<path d="${d}" fill="none" stroke="${CABLE}" stroke-width="2.5"/>`; }
function pulley(cx,cy){ return `<circle cx="${cx}" cy="${cy}" r="5" fill="${M_DARK}"/><circle cx="${cx}" cy="${cy}" r="2" fill="${STACK}"/>`; }
function db(cx,cy,a){ return `<g transform="rotate(${a||0} ${cx} ${cy})"><rect x="${cx-3}" y="${cy-9}" width="6" height="18" rx="2" fill="${M_LIGHT}"/><rect x="${cx-7}" y="${cy-9}" width="14" height="5" rx="2" fill="${BODY}"/><rect x="${cx-7}" y="${cy+4}" width="14" height="5" rx="2" fill="${BODY}"/></g>`; }
function arrow(d){ return `<path class="arrow-anim" d="${d}" fill="none" stroke="${POP}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>`; }
function floor(){ return box(0,141,240,7,FLOOR,0); }
